services:
  redis:
    extends:
      file: ./redis/compose.yaml
      service: redis

  mongo:
    extends:
      file: ./mongo/compose.yaml
      service: mongo

  seaweedfs-master:
    extends:
      file: ./seaweedfs-master/compose.yaml
      service: seaweedfs-master

  seaweedfs-volume:
    extends:
      file: ./seaweedfs-volume/compose.yaml
      service: seaweedfs-volume
    depends_on:
      seaweedfs-master:
        condition: service_healthy

  seaweedfs-filer:
    extends:
      file: ./seaweedfs-filer/compose.yaml
      service: seaweedfs-filer
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy

  seaweedfs-s3:
    extends:
      file: ./seaweedfs-s3/compose.yaml
      service: seaweedfs-s3
    depends_on:
      seaweedfs-filer:
        condition: service_healthy

  git-bridge:
    extends:
      file: ./git-bridge/compose.yaml
      service: git-bridge

  languagetool:
    extends:
      file: ./languagetool/compose.yaml
      service: languagetool

  overleaf:
    extends:
      file: ./overleaf/compose.yaml
      service: overleaf
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_healthy
      git-bridge:
        condition: service_healthy
      languagetool:
        condition: service_healthy

  wakapi-pg:
    extends:
      file: ./wakapi-pg/compose.yaml
      service: wakapi-pg

  wakapi:
    extends:
      file: ./wakapi/compose.yaml
      service: wakapi
    depends_on:
      wakapi-pg:
        condition: service_healthy

  wakapi-probe:
    extends:
      file: ./wakapi-probe/compose.yaml
      service: wakapi-probe
    depends_on:
      wakapi:
        condition: service_healthy

  mongo-probe:
    extends:
      file: ./mongo-probe/compose.yaml
      service: mongo-probe
    depends_on:
      mongo:
        condition: service_healthy

  mongodb-exporter:
    extends:
      file: ./mongodb-exporter/compose.yaml
      service: mongodb-exporter
    depends_on:
      mongo:
        condition: service_healthy

  mongodb-exporter-probe:
    extends:
      file: ./mongodb-exporter-probe/compose.yaml
      service: mongodb-exporter-probe
    depends_on:
      mongodb-exporter:
        condition: service_healthy

  redis-exporter:
    extends:
      file: ./redis-exporter/compose.yaml
      service: redis-exporter
    depends_on:
      redis:
        condition: service_healthy

  redis-exporter-probe:
    extends:
      file: ./redis-exporter-probe/compose.yaml
      service: redis-exporter-probe
    depends_on:
      redis-exporter:
        condition: service_healthy

  instance-sensor:
    extends:
      file: ./instance-sensor/compose.yaml
      service: instance-sensor
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  node-exporter:
    extends:
      file: ./node-exporter/compose.yaml
      service: node-exporter

  prometheus:
    extends:
      file: ./prometheus/compose.yaml
      service: prometheus
    depends_on:
      mongodb-exporter:
        condition: service_healthy
      redis-exporter:
        condition: service_healthy
      instance-sensor:
        condition: service_healthy
      node-exporter:
        condition: service_healthy

  grafana:
    extends:
      file: ./grafana/compose.yaml
      service: grafana
    depends_on:
      prometheus:
        condition: service_healthy

  nginx:
    extends:
      file: ./nginx/compose.yaml
      service: nginx
    depends_on:
      overleaf:
        condition: service_healthy
      wakapi-probe:
        condition: service_healthy
      grafana:
        condition: service_healthy

networks:
  overleaf-network:
    external: true
