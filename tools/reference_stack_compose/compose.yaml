services:
  redis:
    extends:
      file: ./redis/compose.yaml
      service: redis

  mongo:
    extends:
      file: ./mongo/compose.yaml
      service: mongo

  seaweedfs-master:
    extends:
      file: ./seaweedfs-master/compose.yaml
      service: seaweedfs-master

  seaweedfs-volume:
    extends:
      file: ./seaweedfs-volume/compose.yaml
      service: seaweedfs-volume
    depends_on:
      seaweedfs-master:
        condition: service_healthy

  seaweedfs-filer:
    extends:
      file: ./seaweedfs-filer/compose.yaml
      service: seaweedfs-filer
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy

  seaweedfs-s3:
    extends:
      file: ./seaweedfs-s3/compose.yaml
      service: seaweedfs-s3
    depends_on:
      seaweedfs-filer:
        condition: service_healthy

  git-bridge:
    extends:
      file: ./git-bridge/compose.yaml
      service: git-bridge

  languagetool:
    extends:
      file: ./languagetool/compose.yaml
      service: languagetool

  overleaf:
    extends:
      file: ./overleaf/compose.yaml
      service: overleaf
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_healthy
      git-bridge:
        condition: service_healthy
      languagetool:
        condition: service_healthy

  wakapi-pg:
    extends:
      file: ./wakapi-pg/compose.yaml
      service: wakapi-pg

  wakapi:
    extends:
      file: ./wakapi/compose.yaml
      service: wakapi
    depends_on:
      wakapi-pg:
        condition: service_healthy

  wakapi-probe:
    extends:
      file: ./wakapi-probe/compose.yaml
      service: wakapi-probe
    depends_on:
      wakapi:
        condition: service_healthy

  nginx:
    extends:
      file: ./nginx/compose.yaml
      service: nginx
    depends_on:
      overleaf:
        condition: service_healthy
      wakapi-probe:
        condition: service_healthy

networks:
  overleaf-network:
    external: true
