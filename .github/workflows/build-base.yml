name: Build overleaf-cep base (arm64)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'overleaf-cep tag/branch to build the base image from'
        required: true
        default: 'ext-ce'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/overleaf-base

jobs:
  build-base:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout overleaf-cep at requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push base image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --file server-ce/Dockerfile-base \
            --tag ${{ env.IMAGE }}:latest \
            --tag ${{ env.IMAGE }}:${{ inputs.ref }} \
            --push .