name: Build overleaf-cep main (arm64)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'overleaf-cep tag to build (e.g. v6.2.1-ext)'
        required: true
      tag:
        description: 'Output image tag (e.g. 6.2.1-ext-v5.0-arm64)'
        required: true
      base_tag:
        description: 'Base image tag to build against (defaults to :latest)'
        required: false
        default: 'latest'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/overleaf-cep

jobs:
  build-main:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout overleaf-cep at requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push main image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --file server-ce/Dockerfile \
            --build-arg OVERLEAF_BASE_TAG=ghcr.io/${{ github.repository_owner }}/overleaf-base:${{ inputs.base_tag }} \
            --tag ${{ env.IMAGE }}:${{ inputs.tag }} \
            --push .