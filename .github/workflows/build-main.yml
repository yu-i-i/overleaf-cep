name: Build overleaf-cep main (arm64)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the built image'
        required: true
        default: '6.2.0-ext-v5.0-arm64'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/overleaf-cep
  BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/overleaf-base:latest

jobs:
  build-main:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push main image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --file server-ce/Dockerfile \
            --build-arg OVERLEAF_BASE_TAG=${{ env.BASE_IMAGE }} \
            --tag ${{ env.IMAGE }}:${{ inputs.tag }} \
            --push .